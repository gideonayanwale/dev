<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog & Newsletter SaaS</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const App = () => {
      const [posts, setPosts] = useState([]);
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [email, setEmail] = useState('');
      const [message, setMessage] = useState('');

      // Fetch all posts on component mount
      useEffect(() => {
        axios.get('http://localhost:5000/api/posts')
          .then(response => setPosts(response.data))
          .catch(error => console.error('Error fetching posts:', error));
      }, []);

      // Handle blog post submission
      const handlePostSubmit = (e) => {
        e.preventDefault();
        axios.post('http://localhost:5000/api/posts', { title, content })
          .then(response => {
            setPosts([...posts, response.data]);
            setTitle('');
            setContent('');
            setMessage('Post created successfully!');
          })
          .catch(error => setMessage('Error creating post.'));
      };

      // Handle newsletter subscription
      const handleSubscribe = (e) => {
        e.preventDefault();
        axios.post('http://localhost:5000/api/subscribe', { email })
          .then(response => {
            setMessage('Subscribed successfully!');
            setEmail('');
          })
          .catch(error => setMessage('Error subscribing.'));
      };

      return (
        <div className="container mx-auto p-4">
          <h1 className="text-3xl font-bold mb-4">Blog & Newsletter SaaS</h1>

          {/* Blog Post Form */}
          <div className="mb-8">
            <h2 className="text-2xl font-semibold mb-2">Create a Blog Post</h2>
            <div className="mb-4 text-green-600">{message}</div>
            <div className="space-y-4">
              <input
                type="text"
                placeholder="Post Title"
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                className="w-full p-2 border rounded"
              />
              <textarea
                placeholder="Post Content"
                value={content}
                onChange={(e) => setContent(e.target.value)}
                className="w-full p-2 border rounded h-32"
              ></textarea>
              <button
                onClick={handlePostSubmit}
                className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
              >
                Publish Post
              </button>
            </div>
          </div>

          {/* Blog Posts Display */}
          <div className="mb-8">
            <h2 className="text-2xl font-semibold mb-2">Posts</h2>
            {posts.map(post => (
              <div key={post._id} className="border p-4 mb-4 rounded">
                <h3 className="text-xl font-bold">{post.title}</h3>
                <p>{post.content}</p>
                <p className="text-gray-500 text-sm">
                  Posted on {new Date(post.createdAt).toLocaleDateString()}
                </p>
              </div>
            ))}
          </div>

          {/* Newsletter Subscription */}
          <div>
            <h2 className="text-2xl font-semibold mb-2">Subscribe to Newsletter</h2>
            <div className="space-x-2">
              <input
                type="email"
                placeholder="Enter your email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                className="p-2 border rounded"
              />
              <button
                onClick={handleSubscribe}
                className="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
              >
                Subscribe
              </button>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
